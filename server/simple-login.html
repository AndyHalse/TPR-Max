<!DOCTYPE html>
<html>
<head>
    <title>VisiGate Pro - Simple Login</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f0f4f8; padding: 50px; }
        .container { max-width: 400px; margin: 0 auto; background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 5px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #0066cc; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 16px; margin: 10px 0; }
        button:hover { background: #0052a3; }
        .error { color: red; margin: 10px 0; }
        .success { color: green; margin: 10px 0; }
    </style>
</head>
<body>
    <div class="container">
        <h2>VisiGate Pro - Emergency Login</h2>
        <p><strong>Username:</strong> Andy</p>
        <p><strong>Password:</strong> Kubo1966&&</p>
        
        <button onclick="testBasicFunction()">🧪 Test Basic JavaScript</button>
        <button onclick="attemptLogin()">🔑 Attempt Login</button>
        
        <div id="status"></div>
        
        <script>
            function testBasicFunction() {
                alert("Basic JavaScript is working!");
                document.getElementById('status').innerHTML = '<div class="success">✅ JavaScript is working</div>';
            }
            
            async function attemptLogin() {
                const status = document.getElementById('status');
                status.innerHTML = '<div>🔄 Attempting login...</div>';
                
                try {
                    console.log("Making login request...");
                    const response = await fetch('/api/auth/login', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            username: 'Andy',
                            password: 'Kubo1966&&'
                        }),
                        credentials: 'include'
                    });
                    
                    console.log("Response status:", response.status);
                    const data = await response.json();
                    console.log("Response data:", data);
                    
                    if (response.ok && data.success) {
                        status.innerHTML = '<div class="success">✅ Login successful! Redirecting...</div>';
                        setTimeout(() => {
                            window.location.href = '/';
                        }, 1000);
                    } else {
                        status.innerHTML = '<div class="error">❌ Login failed: ' + (data.error || 'Unknown error') + '</div>';
                    }
                } catch (error) {
                    console.error("Login error:", error);
                    status.innerHTML = '<div class="error">❌ Network error: ' + error.message + '</div>';
                }
            }
        </script>
    </div>
</body>
</html>
